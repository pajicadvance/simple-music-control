# general
mod.id = "simple_music_control"
mod.name = "Simple Music Control"
mod.group = "me.pajic"
mod.version = "1.5.7"
mod.description = "Reduced delay between music tracks, next track keybind, creative music in survival, stop music on jukebox play"
mod.authors = "pajic"
mod.contributors = ""
mod.license = "MIT"

# links
mod.sources_url = "https://github.com/pajicadvance/simple-music-control"
mod.homepage_url = "https://modrinth.com/mod/simple-music-control"
mod.issues_url = "https://github.com/pajicadvance/simple-music-control/issues"
mod.discord_url = "https://discord.gg/5RkzS66zWb"

# publishing
publish.modrinth = "8AX2hHnX"
publish.curseforge = "1185599"
publish.env.mr = "CLIENT_ONLY" #https://modmuss50.github.io/mod-publish-plugin/platforms/modrinth/#all-options
publish.env.cf.client = true
publish.env.cf.server = false
publish.dry_run = false

# loom
loomx.loom_version = "1.19-SNAPSHOT"

# dependencies
loader.fabric = "0.20.1"
dep.fzzy_config.coords = "me.fzzyhmstrs:$id:$version"
